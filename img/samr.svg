<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 110 960 500" role="img" aria-label="SAMR-model: vier niveaus van technologiegebruik, van vervangen tot herdefiniëren" font-family="Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="110" width="960" height="500" fill="#ffffff"/>
  <!-- groepen -->
  <text x="30" y="142" font-size="15" font-weight="700" letter-spacing="1.5" fill="#55524C">VERBETERING</text>
  <line x1="30" y1="154" x2="474" y2="154" stroke="#55524C" stroke-width="3"/>
  <text x="486" y="142" font-size="15" font-weight="700" letter-spacing="1.5" fill="#DA4749">TRANSFORMATIE</text>
  <line x1="486" y1="154" x2="930" y2="154" stroke="#DA4749" stroke-width="3"/>
  <!-- trap -->
  <rect x="30" y="400" width="222" height="130" fill="#E8E4DD"/>
  <rect x="252" y="330" width="222" height="200" fill="#CFC9BE"/>
  <rect x="486" y="260" width="222" height="270" fill="#E9777A"/>
  <rect x="708" y="190" width="222" height="340" fill="#DA4749"/>
  <!-- namen -->
  <g font-weight="900" font-size="24" fill="#0B0B0B">
    <text x="44" y="438">Vervangen</text>
    <text x="266" y="368">Verbeteren</text>
    <text x="500" y="298">Aanpassen</text>
    <text x="722" y="228" fill="#ffffff">Herdefiniëren</text>
  </g>
  <g font-size="14" fill="#55524C" font-weight="500">
    <text x="44" y="458">Substitution</text><text x="266" y="388">Augmentation</text><text x="500" y="318" fill="#0B0B0B">Modification</text><text x="722" y="248" fill="#ffffff">Redefinition</text>
  </g>
  <!-- uitleg -->
  <g font-size="15" fill="#0B0B0B">
    <text x="44" y="488">De tool doet wat je</text><text x="44" y="508">eerst anders deed.</text>
    <text x="266" y="420">Zelfde taak, met een</text><text x="266" y="440">merkbare verbetering.</text>
    <text x="500" y="350">De opdracht wordt</text><text x="500" y="370">herontworpen.</text>
  </g>
  <g font-size="15" fill="#ffffff">
    <text x="722" y="280">Taken die zonder</text><text x="722" y="300">de tool niet kunnen.</text>
  </g>
  <!-- voorbeeld rekenmachine -->
  <text x="30" y="562" font-size="13" font-weight="700" letter-spacing="1.2" fill="#55524C">VOORBEELD: DE REKENMACHINE</text>
  <g font-size="13" fill="#0B0B0B">
    <text x="30" y="584">Rekenen op de machine</text>
    <text x="252" y="584">Sommen sneller nakijken</text>
    <text x="486" y="584">Opgaven met echte cijfers</text>
    <text x="708" y="584">Modellen en data verkennen</text>
  </g>
</svg>
