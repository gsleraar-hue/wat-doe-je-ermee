# Houdt het gratis Supabase-project van Het Gilde wakker: zonder verkeer pauzeert Supabase het na een week.
# Elke dag één lichte aanvraag aan de database (de publishable key is openbaar bedoeld; anoniem ziet niets).
name: Gilde wakker houden
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://umrlulhwbkgjxxmvhbbg.supabase.co/rest/v1/rpc/mijn_rol" \
            -H "apikey: sb_publishable_XwY4DpxrYGAQch-hs-bz6g_1T-7pwkh" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase antwoordde $code"
          test "$code" = "200"
